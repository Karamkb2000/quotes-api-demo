<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes</title>
<meta name="description" content="Quotes API demo, deployed with CI/CD to a Linux server behind nginx.">
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --surface-2: #f0f2f8;
    --text: #151a2d;
    --muted: #5d6685;
    --line: #e2e6f1;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --accent-soft: #eceafd;
    --ok: #12805c;
    --ok-soft: #dcf5ea;
    --bad: #c0362c;
    --bad-soft: #fde4e1;
    --shadow: 0 1px 2px rgba(21, 26, 45, .06), 0 8px 24px rgba(21, 26, 45, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1120;
      --surface: #171b30;
      --surface-2: #1e2340;
      --text: #eef0fa;
      --muted: #a2a9c8;
      --line: #2a3050;
      --accent: #8b87ff;
      --accent-ink: #11142a;
      --accent-soft: #25295a;
      --ok: #4cd6a0;
      --ok-soft: #123a2e;
      --bad: #ff8a80;
      --bad-soft: #4a1f1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */
  header { padding: 22px 0; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }

  .status {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: .875rem; color: var(--muted); box-shadow: var(--shadow);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-state="ok"] .dot { background: var(--ok); box-shadow: 0 0 0 4px var(--ok-soft); }
  .status[data-state="bad"] .dot { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft); }
  .status strong { color: var(--text); font-weight: 600; }
  .status .sep { opacity: .4; }

  /* ---------- hero quote ---------- */
  .hero {
    margin: 12px 0 40px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: clamp(28px, 6vw, 56px);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
    background: linear-gradient(90deg, var(--accent), #22b8cf);
  }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 18px; }
  blockquote { margin: 0; min-height: 7.5rem; }
  blockquote p {
    margin: 0 0 18px;
    font-size: clamp(1.6rem, 4.6vw, 2.6rem);
    line-height: 1.2; letter-spacing: -.02em; font-weight: 700;
  }
  blockquote p::before { content: "\201C"; }
  blockquote p::after { content: "\201D"; }
  blockquote footer { color: var(--muted); font-size: 1.05rem; padding: 0; }
  blockquote footer::before { content: "\2014\00a0"; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

  button, .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 12px; padding: 12px 20px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text);
    transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
  }
  button:hover { background: var(--accent-soft); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  button:disabled { opacity: .55; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* skeleton while loading */
  .skeleton { animation: pulse 1.2s ease-in-out infinite; }
  .skeleton p, .skeleton footer { color: transparent; background: var(--surface-2); border-radius: 10px; }
  .skeleton p::before, .skeleton p::after, .skeleton footer::before { content: none; }
  .skeleton p { height: 2.4rem; }
  .skeleton footer { height: 1.1rem; width: 8rem; }
  @keyframes pulse { 50% { opacity: .5; } }

  /* ---------- list ---------- */
  .list-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.01em; }
  .count { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .search { position: relative; flex: 1 1 260px; max-width: 360px; }
  .search input {
    width: 100%; font: inherit; color: var(--text);
    padding: 12px 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .search input::placeholder { color: var(--muted); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); padding: 0; margin: 0 0 56px; list-style: none; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px; justify-content: space-between;
  }
  .card .num { color: var(--accent); font-weight: 700; font-size: .8rem; letter-spacing: .1em; }
  .card q { quotes: "\201C" "\201D"; font-size: 1.1rem; font-weight: 600; line-height: 1.35; }
  .card .by { color: var(--muted); font-size: .9rem; }
  .card button { align-self: flex-start; padding: 8px 14px; font-size: .875rem; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }

  /* ---------- error ---------- */
  .banner {
    display: none; margin: 0 0 24px; padding: 14px 16px; border-radius: 12px;
    background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad);
  }
  .banner.show { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner button { padding: 8px 14px; background: transparent; color: inherit; border-color: currentColor; }

  /* ---------- footer ---------- */
  footer.site { border-top: 1px solid var(--line); padding: 28px 0 48px; color: var(--muted); font-size: .9rem; }
  footer.site .wrap { display: flex; gap: 16px 28px; justify-content: space-between; flex-wrap: wrap; }
  footer.site a { color: var(--accent); text-decoration: none; font-weight: 600; }
  footer.site a:hover { text-decoration: underline; }
  footer.site code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: .85em; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-weight: 600; font-size: .9rem; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">Quotes<span>.</span>api</div>
    <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Checking server</span>
      <span class="sep" aria-hidden="true">|</span>
      <span id="status-version">version -</span>
      <span class="sep" aria-hidden="true">|</span>
      <span id="status-latency">- ms</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" role="alert">
    <span id="banner-text">Could not reach the API.</span>
    <button type="button" id="retry">Try again</button>
  </div>

  <section class="hero" aria-labelledby="hero-label">
    <p class="eyebrow" id="hero-label">Quote of the moment</p>
    <blockquote id="hero" class="skeleton" aria-live="polite" aria-busy="true">
      <p id="hero-text">Loading</p>
      <footer id="hero-author">Loading</footer>
    </blockquote>
    <div class="actions">
      <button type="button" class="primary" id="next">New quote</button>
      <button type="button" id="copy">Copy quote</button>
    </div>
  </section>

  <section aria-labelledby="all-title">
    <div class="list-head">
      <div>
        <h2 id="all-title">All quotes</h2>
        <div class="count" id="count" aria-live="polite"></div>
      </div>
      <div class="search">
        <label class="sr-only" for="q">Search quotes</label>
        <input id="q" type="search" placeholder="Search by text or author" autocomplete="off">
      </div>
    </div>
    <ul class="grid" id="grid"></ul>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <div>Served by nginx on port 80, proxied to Node on <code>127.0.0.1:3000</code>.</div>
    <div>
      API:
      <a href="/api/quotes">/api/quotes</a> &middot;
      <a href="/api/quotes/random">/random</a> &middot;
      <a href="/api/version">/api/version</a> &middot;
      <a href="/health">/health</a>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let quotes = [];
  let current = null;

  async function getJSON(url, ms = 4000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function showBanner(msg) {
    $("banner-text").textContent = msg;
    $("banner").classList.add("show");
  }
  function hideBanner() { $("banner").classList.remove("show"); }

  /* ---------- hero ---------- */
  function renderHero(q) {
    current = q;
    $("hero-text").textContent = q.text;
    $("hero-author").textContent = q.author;
    $("hero").classList.remove("skeleton");
    $("hero").setAttribute("aria-busy", "false");
  }

  async function nextQuote() {
    const btn = $("next");
    btn.disabled = true;
    try {
      let q = await getJSON("/api/quotes/random");
      // avoid showing the same quote twice in a row
      for (let i = 0; i < 4 && current && q.id === current.id; i++) {
        q = await getJSON("/api/quotes/random");
      }
      renderHero(q);
      hideBanner();
    } catch (e) {
      showBanner("Could not load a quote. The server may be restarting.");
    } finally {
      btn.disabled = false;
    }
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (_) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
    }
    toast("Copied to clipboard");
  }
  const fmt = (q) => "“" + q.text + "” — " + q.author;

  /* ---------- list ---------- */
  function renderList(filter = "") {
    const f = filter.trim().toLowerCase();
    const shown = quotes.filter((q) => !f || (q.text + " " + q.author).toLowerCase().includes(f));
    const grid = $("grid");
    grid.textContent = "";

    $("count").textContent = f
      ? shown.length + " of " + quotes.length + " quotes"
      : quotes.length + " quotes";

    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No quotes match “" + filter.trim() + "”.";
      grid.appendChild(li);
      return;
    }

    for (const q of shown) {
      const li = document.createElement("li");
      li.className = "card";

      const top = document.createElement("div");
      const num = document.createElement("div");
      num.className = "num";
      num.textContent = "#" + q.id;
      const text = document.createElement("q");
      text.textContent = q.text;
      top.append(num, text);

      const by = document.createElement("div");
      by.className = "by";
      by.textContent = q.author;

      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "Copy";
      copy.addEventListener("click", () => copyText(fmt(q)));

      li.append(top, by, copy);
      grid.appendChild(li);
    }
  }

  async function loadList() {
    try {
      quotes = await getJSON("/api/quotes");
      renderList($("q").value);
    } catch (e) {
      showBanner("Could not load the quote list.");
    }
  }

  /* ---------- live deployment status ---------- */
  async function checkStatus() {
    const el = $("status");
    const t0 = performance.now();
    try {
      const [health, ver] = await Promise.all([getJSON("/health", 3000), getJSON("/api/version", 3000)]);
      const ms = Math.round(performance.now() - t0);
      const ok = health && health.status === "ok";
      el.dataset.state = ok ? "ok" : "bad";
      $("status-text").innerHTML = "";
      const s = document.createElement("strong");
      s.textContent = ok ? "Healthy" : "Unhealthy";
      $("status-text").appendChild(s);
      $("status-version").textContent = "v" + ver.version;
      $("status-latency").textContent = ms + " ms";
    } catch (err) {
      // An HTTP error (e.g. 500 from /health) means the app answered but is
      // unhealthy; anything else (timeout, refused) means it is unreachable.
      const answered = err && /^HTTP \d+/.test(err.message || "");
      el.dataset.state = "bad";
      $("status-text").textContent = answered ? "Unhealthy (" + err.message + ")" : "Unreachable";
      $("status-version").textContent = "version -";
      $("status-latency").textContent = "- ms";
    }
  }

  /* ---------- wire up ---------- */
  $("next").addEventListener("click", nextQuote);
  $("copy").addEventListener("click", () => current && copyText(fmt(current)));
  $("q").addEventListener("input", (e) => renderList(e.target.value));
  $("retry").addEventListener("click", () => { nextQuote(); loadList(); checkStatus(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "n" || e.key === "N") nextQuote();
  });

  nextQuote();
  loadList();
  checkStatus();
  setInterval(checkStatus, 5000);
})();
</script>
</body>
</html>
