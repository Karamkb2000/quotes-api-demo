# ============================================================
# CI — lint, security scan, unit + API tests, coverage
# Runs on push to main and on every pull request.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  security:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  test:
    name: Unit + API tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: API tests
        run: npm run test:api

      # Re-runs everything with coverage and enforces the thresholds in
      # package.json (the step fails if coverage drops below them).
      - name: Coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (n, m) => `| ${n} | ${m.pct}% | ${m.covered}/${m.total} |`;
              console.log("## Coverage\n");
              console.log("| Metric | Covered | Count |");
              console.log("|---|---|---|");
              console.log(row("Statements", s.statements));
              console.log(row("Branches", s.branches));
              console.log(row("Functions", s.functions));
              console.log(row("Lines", s.lines));
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
